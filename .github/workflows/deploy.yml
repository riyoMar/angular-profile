name: Deploy portfolio with Angular to GitHub Pages

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Expose TypeScript output directory
        run: |
          node <<'NODE'
          const { appendFileSync, readFileSync } = require('node:fs');
          const tsconfig = JSON.parse(readFileSync('tsconfig.json', 'utf8'));
          const outDir = tsconfig.compilerOptions?.outDir;
          if (typeof outDir !== 'string' || outDir.includes('\n')) {
            throw new Error('tsconfig.json must define a single-line compilerOptions.outDir');
          }
          console.log(`TypeScript output directory: ${outDir}`);
          appendFileSync(process.env.GITHUB_ENV, `TS_OUT_DIR=${outDir}\n`);
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Build Angular app
        run: npm run build -- --base-href "/${{ github.event.repository.name }}/"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/angular-profile/browser
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4